<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Clinic Management System preview</title>
  <desc id="desc">A polished login interface preview for the Clinic Management System.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1440" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEF4FF"/>
      <stop offset="1" stop-color="#F8FAFF"/>
    </linearGradient>
    <linearGradient id="bluePanel" x1="40" y1="48" x2="760" y2="852" gradientUnits="userSpaceOnUse">
      <stop stop-color="#103A81"/>
      <stop offset="1" stop-color="#1297D8"/>
    </linearGradient>
    <linearGradient id="lightPanel" x1="786" y1="48" x2="1400" y2="852" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F8FF"/>
    </linearGradient>
    <linearGradient id="buttonBlue" x1="820" y1="470" x2="1368" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2E63D8"/>
      <stop offset="1" stop-color="#3566E8"/>
    </linearGradient>
    <radialGradient id="orbOne" cx="0" cy="0" r="1" gradientTransform="translate(676 130) rotate(90) scale(180)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8CB2F4" stop-opacity=".75"/>
      <stop offset="1" stop-color="#8CB2F4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbTwo" cx="0" cy="0" r="1" gradientTransform="translate(82 812) rotate(90) scale(146)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6EA4EE" stop-opacity=".5"/>
      <stop offset="1" stop-color="#6EA4EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#1C2F63" flood-opacity=".12"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#294780" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect width="1440" height="900" rx="50" fill="url(#pageBg)"/>

  <g filter="url(#softShadow)">
    <rect x="40" y="48" width="720" height="804" rx="38" fill="url(#bluePanel)"/>
    <circle cx="676" cy="130" r="180" fill="url(#orbOne)"/>
    <circle cx="82" cy="812" r="146" fill="url(#orbTwo)"/>

    <rect x="78" y="86" width="76" height="76" rx="22" fill="#204B94" stroke="#78A5ED" stroke-opacity=".45"/>
    <text x="116" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#9EC0FF">TLP</text>
    <text x="172" y="126" font-family="Arial, sans-serif" font-size="25" font-weight="500" fill="#EAF3FF">TLP Laguna Philippines Inc.</text>

    <text x="82" y="632" font-family="Arial, sans-serif" font-size="56" font-weight="700" fill="#FFFFFF">Welcome back.</text>
    <text x="82" y="686" font-family="Arial, sans-serif" font-size="27" fill="#D7E8FF">Use your Company ID or Department Gmail and password</text>
    <text x="82" y="726" font-family="Arial, sans-serif" font-size="27" fill="#D7E8FF">to access the dashboard.</text>
    <text x="82" y="814" font-family="Arial, sans-serif" font-size="21" fill="#AAC7EE">Copyright (c) 2026 TRIPLE J All Rights Reserved</text>
  </g>

  <g filter="url(#cardShadow)">
    <rect x="786" y="48" width="614" height="804" rx="38" fill="url(#lightPanel)" stroke="#D6E0F5"/>

    <rect x="1204" y="88" width="150" height="44" rx="22" fill="#EEF4FF" stroke="#D0DCF4"/>
    <circle cx="1228" cy="110" r="10" fill="#E1EBFF" stroke="#AFC4EC"/>
    <path d="M1226 110h4m-2-2v4" stroke="#3A67DA" stroke-width="1.8" stroke-linecap="round"/>
    <text x="1246" y="117" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#3461D6">Help Center</text>

    <text x="1093" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="56" font-weight="700" fill="#153A8A">Login</text>
    <text x="1093" y="284" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#7C92BE">Sign in to continue.</text>

    <text x="822" y="356" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#214996">COMPANY ID OR DEPARTMENT GMAIL</text>
    <rect x="820" y="374" width="548" height="56" rx="28" fill="#FFFFFF" stroke="#D5DFF3" stroke-width="2"/>
    <rect x="834" y="390" width="22" height="22" rx="5" fill="#214996" fill-opacity=".14"/>
    <path d="M845 396a6 6 0 1 0 0 0.01Zm-9 14c1.8-3.3 5-5 9-5s7.2 1.7 9 5" stroke="#214996" stroke-width="2" stroke-linecap="round"/>

    <text x="822" y="470" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#214996">PASSWORD</text>
    <rect x="820" y="488" width="548" height="56" rx="28" fill="#FFFFFF" stroke="#D5DFF3" stroke-width="2"/>
    <rect x="834" y="504" width="22" height="22" rx="5" fill="#214996" fill-opacity=".14"/>
    <path d="M839 510h12v10h-12zm2-2a4 4 0 0 1 8 0" stroke="#214996" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1335" cy="516" r="10" fill="#EEF4FF" stroke="#CCD9F3"/>
    <path d="M1330 516c2.5-3 7.5-3 10 0-2.5 3-7.5 3-10 0Zm5 0a1.7 1.7 0 1 0 0 0.01Z" fill="#2E63D8"/>

    <rect x="820" y="568" width="548" height="56" rx="28" fill="url(#buttonBlue)"/>
    <text x="1094" y="604" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">LOGIN</text>

    <rect x="820" y="646" width="548" height="56" rx="28" fill="#FFFFFF" stroke="#9AA8C5" stroke-width="2"/>
    <circle cx="938" cy="674" r="12" fill="#FFFFFF" stroke="#E4EAF8"/>
    <path d="M932 674h12" stroke="#FBBC05" stroke-width="3" stroke-linecap="round"/>
    <path d="M938 668v12" stroke="#34A853" stroke-width="3" stroke-linecap="round"/>
    <path d="M934 670l8 8" stroke="#EA4335" stroke-width="3" stroke-linecap="round"/>
    <path d="M942 670l-8 8" stroke="#4285F4" stroke-width="3" stroke-linecap="round"/>
    <text x="970" y="681" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#1B243C">Continue with Google</text>

    <rect x="820" y="724" width="548" height="56" rx="28" fill="#FFFFFF" stroke="#4A7DF0" stroke-width="2"/>
    <circle cx="938" cy="752" r="12" fill="#FFFFFF" stroke="#E4EAF8"/>
    <path d="M932 752h12" stroke="#FBBC05" stroke-width="3" stroke-linecap="round"/>
    <path d="M938 746v12" stroke="#34A853" stroke-width="3" stroke-linecap="round"/>
    <path d="M934 748l8 8" stroke="#EA4335" stroke-width="3" stroke-linecap="round"/>
    <path d="M942 748l-8 8" stroke="#4285F4" stroke-width="3" stroke-linecap="round"/>
    <text x="970" y="759" font-family="Arial, sans-serif" font-size="24" font-weight="600" fill="#2F63DB">Sign up with Google</text>

    <text x="1093" y="818" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="500" fill="#2F63DB">Create new account</text>
    <text x="1093" y="854" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="500" fill="#2F63DB">Forgot password?</text>
  </g>
</svg>
